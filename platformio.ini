; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32 @ 4.2.0
board = esp32doit-devkit-v1
framework = arduino
extra_scripts = pre:tools/patch_async_webserver.py
build_src_filter = +<*> +<../base/json_writer.cpp>
build_unflags = -fno-exceptions
build_flags = -fexceptions -DWS_MAX_QUEUED_MESSAGES=4 -DCORE_DEBUG_LEVEL=5 -I"${platformio.packages_dir}/framework-arduinoespressif32@3.20002.220503/libraries/SPI/src"
monitor_port = COM5
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak setup
; lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	adafruit/Adafruit NeoPixel@^1.12.0
	adafruit/RTClib@2.1.4
	freenove/Freenove WS2812 Lib for ESP32@^1.0.5
	heman/AsyncMqttClient-esphome@^2.0.0
	joaolopesf/RemoteDebug@^3.0.5


upload_protocol = espota
upload_port = 192.168.1.90

; Migracion unica por USB: conserva NVS y coredump, reemplaza SPIFFS por dos slots OTA grandes.
; Usar: pio run -e serial-migration -t upload --upload-port COMx
[env:serial-migration]
extends = env:esp32doit-devkit-v1
board_build.partitions = partitions_esp32_ota_1f.csv
build_flags = ${env:esp32doit-devkit-v1.build_flags} -Iinclude
upload_protocol = esptool
upload_port =
lib_deps =
	ESP32Async/AsyncTCP@3.3.8
	ESP32Async/ESPAsyncWebServer@3.7.4
	adafruit/Adafruit NeoPixel@1.12.0
	adafruit/RTClib@2.1.4
	freenove/Freenove WS2812 Lib for ESP32@^1.0.5
	heman/AsyncMqttClient-esphome@2.0.0
	joaolopesf/RemoteDebug@3.0.5
lib_ignore = AsyncTCP-esphome

; OTA despues de migrar particiones: compila con la tabla nueva y transmite solo la aplicacion.
[env:ota]
extends = env:serial-migration
upload_protocol = espota
upload_port = 192.168.1.90
